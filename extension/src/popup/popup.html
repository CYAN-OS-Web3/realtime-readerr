<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyan Translator</title>
  <style>
    :root{
      --bg:#0b0f14; --panel:#0a0d12; --border:#143a45; --text:#d1d5db; --muted:#9ca3af;
      --cyan:#06b6d4; --cyan-dark:#0891b2; --red:#ef4444; --gray:#111827; --gray-2:#1f2937; --gray-3:#374151;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{margin:0;padding:0;overflow-x:hidden}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);width:360px;font-size:12px}
    .card{background:var(--panel);border:1px solid rgba(20,58,69,.25);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
    .header{background:linear-gradient(90deg,var(--cyan-dark),#0ea5b7);padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
    .header .title{font-weight:600;font-size:11px;color:#fff}
    .header .badge{font-size:9px;background:rgba(0,0,0,.2);color:#e0f2fe;padding:1px 6px;border-radius:99px}
    .section{padding:10px 12px}
    .label{font-size:10px;color:#64748b;margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
    select,input[type=text],input[type=password],.input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--gray-2);background:#0f172a;color:#e5e7eb;font-size:11px;outline:none;transition:border-color .2s}
    select:focus,.input:focus{border-color:var(--cyan)}
    .btn{padding:7px 10px;border-radius:8px;border:1px solid var(--gray-2);background:#0f172a;color:#e5e7eb;font-size:11px;cursor:pointer;transition:all .2s;text-align:center}
    .btn:hover{border-color:rgba(6,182,212,.4);background:#111827}
    .btn:active{transform:scale(.97)}
    .btn-primary{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border:none;font-weight:600}
    .btn-primary:hover{background:linear-gradient(135deg,#0891b2,#0e7490)}
    .btn-danger{background:#ef4444;color:#fff;border:none}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
    .meter{height:6px;background:#0f172a;border-radius:99px;overflow:hidden;border:1px solid var(--gray-2)}
    .meter-fill{height:100%;transition:width .15s ease;background:linear-gradient(90deg,#06b6d4,#22d3ee);border-radius:99px}
    .preview-box{background:#0b1324;border:1px solid var(--gray-2);border-radius:8px;padding:8px}
    .pill{padding:1px 6px;border-radius:99px;font-size:9px;font-weight:500}
    .pill-online{background:rgba(6,182,212,.15);color:#6ed7e8}
    .pill-off{background:rgba(239,68,68,.15);color:#fca5a5}
    .row{display:flex;gap:6px;align-items:center}
    .row-between{display:flex;justify-content:space-between;align-items:center}
    .small{font-size:10px;color:#64748b}
    .divider{border-top:1px solid var(--gray-2);margin:0}
    .collapse-btn{width:100%;background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;padding:4px 0;text-align:left;display:flex;align-items:center;gap:4px}
    .collapse-btn:hover{color:var(--text)}
    .hidden{display:none}
    input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:var(--gray-2);border-radius:99px;outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--cyan);cursor:pointer}
    .status-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
    .status-dot.online{background:#06b6d4}
    .status-dot.offline{background:#ef4444}
    .footer{padding:6px 12px;border-top:1px solid var(--gray-2);display:flex;justify-content:space-between;align-items:center}
    .tab-bar{display:flex;border-bottom:1px solid var(--gray-2);background:#0a0d12}
    .tab{flex:1;padding:6px 0;text-align:center;font-size:10px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
    .tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
    .tab:hover{color:var(--text)}
    .tab-content{display:none}
    .tab-content.active{display:block}
  </style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="row">
        <span style="font-size:14px">🌐</span>
        <span class="title">Cyan AI Translator</span>
      </div>
      <div class="row">
        <span id="serverPill" class="pill pill-online">ONLINE</span>
        <span id="latency" class="small" style="color:#a5f3fc">0ms</span>
        <span class="badge">EXT</span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <div class="tab active" data-tab="main">🎙️ Translate</div>
      <div class="tab" data-tab="settings">⚙️ Settings</div>
      <div class="tab" data-tab="premium">💎 Premium</div>
    </div>

    <!-- Tab: Main (Translation) -->
    <div class="tab-content active" id="tab-main">
      <div class="section">
        <!-- Language Selection -->
        <div class="grid" style="margin-bottom:8px">
          <div>
            <label class="label">Source</label>
            <select id="sourceLang"></select>
          </div>
          <div>
            <label class="label">Target</label>
            <select id="targetLang"></select>
          </div>
        </div>

        <!-- TTS Engine -->
        <div style="margin-bottom:8px">
          <label class="label">TTS Engine</label>
          <select id="ttsEngine">
            <option value="google">Google WaveNet (Default)</option>
            <option value="azure">Azure Neural (Fast)</option>
            <option value="elevenlabs">ElevenLabs (Premium)</option>
          </select>
        </div>

        <!-- Voice Gender -->
        <div style="margin-bottom:8px">
          <label class="label">Voice Gender</label>
          <select id="voiceGender">
            <option value="female">Female</option>
            <option value="male">Male</option>
          </select>
        </div>

        <!-- Enable AI on site -->
        <button class="btn btn-primary" id="enableSite" style="width:100%;margin-bottom:8px">
          🔌 Enable AI on This Site
        </button>

        <!-- Mic Section -->
        <div class="preview-box" style="margin-bottom:8px">
          <div class="row-between" style="margin-bottom:4px">
            <div class="row">
              <span>🎤</span>
              <span class="small" style="color:var(--text)">Microphone</span>
            </div>
            <span id="micActive" class="small">Ready</span>
          </div>
          <div class="row-between" style="margin-bottom:4px">
            <span class="small">Volume</span>
            <span id="micVol" class="small">0%</span>
          </div>
          <div class="meter"><div id="meterFill" class="meter-fill" style="width:0%"></div></div>
          <div class="row-between" style="margin-top:6px;margin-bottom:2px">
            <span class="small">Sensitivity</span>
            <span id="sensVal" class="small">50%</span>
          </div>
          <input type="range" id="sensitivity" min="0" max="100" value="50" />
          <button class="btn" id="localFeedback" style="width:100%;margin-top:6px">🔊 Local Feedback</button>
        </div>

        <!-- Quick TTS Test -->
        <div class="grid" style="margin-bottom:8px">
          <div>
            <label class="label">Test Text</label>
            <input type="text" class="input" id="ttsText" placeholder="Enter text..." />
          </div>
          <div>
            <label class="label">Voice Sample</label>
            <input type="file" id="sampleFile" accept="audio/mpeg,audio/mp3" style="font-size:10px;color:var(--muted)" />
          </div>
        </div>
        <div class="grid" style="margin-bottom:8px">
          <button class="btn btn-primary" id="cloneSpeak">Clone & Speak</button>
          <button class="btn" id="cloneStream">Clone & Stream</button>
        </div>
        <div class="row-between">
          <span id="cloneStatus" class="small"></span>
          <span id="streamStatus" class="small"></span>
        </div>

        <!-- Translation Preview -->
        <div class="preview-box" style="margin-top:8px">
          <div class="row-between" style="margin-bottom:4px">
            <span class="small" style="color:var(--text)">Translation Preview</span>
            <span id="livePill" class="pill pill-online" style="display:none">LIVE</span>
          </div>
          <div id="previewSource" class="small" style="color:#9ca3af;margin-bottom:2px">—</div>
          <div id="previewTarget" class="small" style="color:#a7f3d0">—</div>
        </div>
      </div>
    </div>

    <!-- Tab: Settings -->
    <div class="tab-content" id="tab-settings">
      <div class="section">
        <div style="margin-bottom:8px">
          <label class="label">API Base URL</label>
          <input type="text" class="input" id="apiBase" placeholder="https://your-backend.vercel.app" />
        </div>
        <div style="margin-bottom:8px">
          <label class="label">API Key</label>
          <input type="password" class="input" id="apiKey" placeholder="sk_live_..." />
        </div>
        <div style="margin-bottom:8px">
          <label class="label">User ID (Supabase)</label>
          <input type="text" class="input" id="userId" placeholder="uuid" />
        </div>
        <div class="grid" style="margin-bottom:8px">
          <button class="btn" id="getQuota">📊 Get Quota</button>
          <div class="row" style="align-items:center">
            <span class="small">Quota:</span>
            <span id="quotaText" class="small" style="color:var(--cyan)">—</span>
          </div>
        </div>
        <button class="btn" id="downloadAppBtn" style="width:100%">⬇️ Download Desktop App</button>
        <span class="small" id="downloadHint" style="display:block;margin-top:4px;text-align:center">Get the full Electron experience</span>
      </div>
    </div>

    <!-- Tab: Premium -->
    <div class="tab-content" id="tab-premium">
      <div class="section">
        <!-- Voice Assignment -->
        <div class="preview-box" style="margin-bottom:8px">
          <span class="small" style="color:var(--text);display:block;margin-bottom:6px">🎤 Premium Voice (ElevenLabs)</span>
          <div class="grid" style="margin-bottom:6px">
            <div>
              <label class="label">Device ID</label>
              <input type="text" class="input" id="deviceId" placeholder="e.g. laptop-01" />
            </div>
            <div>
              <label class="label">Voice Sample</label>
              <input type="file" id="voiceSample" accept="audio/mpeg,audio/mp3" style="display:none" />
              <button class="btn" id="chooseVoiceSampleBtn" style="width:100%;margin-top:2px">Choose File</button>
              <span id="voiceSampleName" class="small" style="display:block;margin-top:2px">No file</span>
            </div>
          </div>
          <div class="grid" style="margin-bottom:4px">
            <button class="btn" id="assignVoiceBtn">Assign Voice</button>
            <span id="assignStatus" class="small" style="align-self:center"></span>
          </div>
          <div class="grid-3" style="margin-bottom:4px">
            <button class="btn" id="updateVoiceBtn">Update ($5)</button>
            <button class="btn" id="capturePaymentBtn">Complete</button>
            <span id="updateStatus" class="small" style="align-self:center"></span>
          </div>
        </div>

        <!-- Subscription -->
        <div class="preview-box">
          <span class="small" style="color:var(--text);display:block;margin-bottom:6px">💎 Premium Subscription</span>
          <div class="grid-3">
            <button class="btn btn-primary" id="subscribeBtn">Subscribe</button>
            <button class="btn" id="checkSubBtn">Check</button>
            <button class="btn" id="activateSubBtn">Activate</button>
          </div>
          <span id="subStatus" class="small" style="display:block;margin-top:4px"></span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="row">
        <span>🎙️</span>
        <span class="small" id="footerState">Ready</span>
      </div>
      <span class="small">v2.1.0</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
